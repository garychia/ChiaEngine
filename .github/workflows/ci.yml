name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]  # Push tags starting with v
  pull_request:
    branches: [ main, develop ]

env:
  # Build type
  BUILD_TYPE: Debug
  # Cache key prefix
  CACHE_PREFIX: chiaengine-${{ github.sha }}

jobs:
  # Matrix build and test across OS and compilers
  build-and-test:
    name: Build and Test (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        compiler: [gcc, clang, msvc]  # Will be filtered per OS
        include:
          # Linux: gcc and clang
          - os: ubuntu-24.04
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-24.04
            compiler: clang
            cc: clang
            cxx: clang++
          # Windows: MSVC only (default)
          - os: windows-2022
            compiler: msvc
          # macOS: AppleClang
          - os: macos-14
            compiler: appleclang
            cc: clang
            cxx: clang++
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get all tags for versioning

      - name: Setup dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake g++ git libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev pkg-config libvulkan-dev ccache \
            clang-tidy clang-format lcov

      - name: Setup dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake ninja pkg-config ccache
          brew install vulkan-sdk
          brew install glm
          brew install clang-format clang-tidy

      - name: Setup Ninja
        if: runner.os != 'Windows'
        run: |
          sudo apt-get install -y ninja-build  # Linux
          # macOS: brew install ninja (already done above)

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/.ccache
          key: ccache-${{ runner.os }}-${{ matrix.compiler }}-${{ hashFiles('CMakeLists.txt', 'src/CMakeLists.txt') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.compiler }}-

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DGLFW_BUILD_TESTS=OFF \
            -DGLFW_BUILD_EXAMPLES=OFF \
            -GNinja

      - name: Build engine and tests
        run: cmake --build build -j$(nproc)

      - name: Run syntax-only check (for headless CI)
        if: runner.os == 'Linux' && matrix.compiler == 'gcc'
        run: |
          g++ -std=c++17 -fsyntax-only -I src/include -I test -c test/Data/DataModule.cpp
          g++ -std=c++17 -fsyntax-only -I src/include -I test -c test/System/SystemModule.cpp

      - name: Run unit tests
        run: ./build/bin/ChiaEngineTests
        env:
          # For headless testing on Linux
          DISPLAY: :99
        # Start virtual display for Linux headless testing
        continue-on-error: true  # Allow test failures for now to see what breaks

      - name: Test ChiaApp build (link check)
        run: cmake --build build -j$(nproc) --target ChiaApp

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chiaengine-${{ matrix.os }}-${{ matrix.compiler }}-${{ github.sha }}
          path: |
            build/bin/*
            build/lib/*
            build/archives/*
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            Testing/*/Test*.log
            build/Testing/*/Test*.log
          retention-days: 30

  # Code quality checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-24.04
    needs: [build-and-test]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            clang-format clang-tidy python3-pip

      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run clang-format check
        run: |
          # Find all source files
          find src -name "*.hpp" -o -name "*.cpp" -o -name "*.h" -o -name "*.c" | sort | uniq > files.txt || true
          if [ -s files.txt ]; then
            clang-format --dry-run --Werror -files files.txt
          else
            echo "No source files found"
            exit 1
          fi

      - name: Run clang-tidy
        run: |
          find src -name "*.hpp" -o -name "*.cpp" -o -name "*.h" -o -name "*.c" | sort | uniq > files.txt || true
          if [ -s files.txt ]; then
            # Run clang-tidy with a compile_commands.json from our build
            mkdir -p build-tidy
            cd build-tidy
            cmake .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -GNinja
            cmake --build . -j$(nproc)
            # Now run clang-tidy
            run-clang-tidy -p . -header-filter='.*' -jobs=$(nproc) || echo "Clang-tidy found issues (expected during development)"
          else
            echo "No source files found"
            exit 1
          fi

      - name: Run cppcheck
        run: |
          cppcheck --enable=all --suppress=missingIncludeSystem --inline-suppr \
            src/ || echo "Cppcheck found issues (review needed)"

      - name: Check for TODO/FIXME comments
        run: |
          if git grep -i -E "TODO|FIXME|HACK|XXX" -- "*.hpp" "*.h" "*.cpp" "*.c" "*.md"; then
            echo "Warning: Found TODO/FIXME comments"
          fi

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-24.04
    needs: [build-and-test]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install security tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            binutils gcc make pkg-config re2c  # For flawfinder
          pip3 install bandit safety

      - name: Run flawfinder (C/C++ security scanner)
        run: |
          flawfinder --dataonly --quiet src/ || echo "Flawfinder completed"

      - name: Run bandit (Python security)
        if: false  # Disable for now as we have minimal Python
        run: |
          bandit -r . || echo "Bandit completed"

      - name: Check for dangerous functions
        run: |
          if grep -r -E "gets|strcpy|sprintf|vsprintf" src/ --include="*.hpp" --include="*.h" --include="*.cpp" --include="*.c"; then
            echo "Warning: Found potentially dangerous C functions"
            exit 1
          fi

  # Documentation validation
  docs:
    name: Documentation Check
    runs-on: ubuntu-24.04
    needs: [build-and-test]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for broken links in markdown
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip
          pip3 install markdown-link-check
          markdown-link-check README.md docs/**/*.md || echo "Link check completed"

      - name: Validate CMakeLists.txt syntax
        run: |
          mkdir -p build
          cd build
          cmake .. >/dev/null 2>&1 && echo "CMake configuration successful" || (echo "CMake configuration failed" && exit 1)

  # Release workflow
  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: [build-and-test, code-quality, security, docs]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write  # Needed to create releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake g++ git libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev pkg-config libvulkan-dev ccache

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/.ccache
          key: ccache-release-${{ hashFiles('CMakeLists.txt', 'src/CMakeLists.txt') }}
          restore-keys: |
            ccache-release-

      - name: Configure and build (Release)
        run: |
          cmake -B build-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DGLFW_BUILD_TESTS=OFF \
            -DGLFW_BUILD_EXAMPLES=OFF \
            -GNinja
          cmake --build build-release -j$(nproc)

      - name: Create release assets
        run: |
          mkdir -p release
          # Copy binaries
          cp build-release/bin/* release/ 2>/dev/null || true
          cp build-release/lib/* release/ 2>/dev/null || true
          # Create version file
          echo "${GITHUB_REF_NAME}" > release/VERSION
          # Create changelog from git log
          git log --oneline --no-merges $(git describe --tags --abbrev=0)..HEAD > release/CHANGELOG.md || echo "No changelog entries" > release/CHANGELOG.md
          # Create tarball
          tar -czf chiaengine-${{ github.ref_name }}-linux.tar.gz -C release .
          # Also create Windows zip if we had Windows builds
          # zip -r chiaengine-${{ github.ref_name }}-windows.zip release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ChiaEngine ${{ github.ref_name }}
          body: |
            ChiaEngine release ${{ github.ref_name }}

            ## Assets
            - Linux binaries (tar.gz)

            ## Build Info
            - Built on: ${{ runner.os }}
            - Commit: ${{ github.sha }}

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/release/CHANGELOG.md) for details.
          files: |
            release/*
          draft: false
          prerelease: false

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chiaengine-release-${{ github.ref_name }}
          path: |
            release/*
            chiaengine-*.tar.gz
          retention-days: 90

  # Nightly builds (for develop branch)
  nightly:
    name: Nightly Build (Develop)
    runs-on: ubuntu-24.04
    schedule:
      - cron: '0 2 * * *'  # 2 AM UTC daily
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake g++ git libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev pkg-config libvulkan-dev ccache

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/.ccache
          key: ccache-nightly-${{ hashFiles('CMakeLists.txt', 'src/CMakeLists.txt') }}
          restore-keys: |
            ccache-nightly-

      - name: Build and test
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DGLFW_BUILD_TESTS=OFF \
            -DGLFW_BUILD_EXAMPLES=OFF \
            -GNinja
          cmake --build build -j$(nproc)
          ./build/bin/ChiaEngineTests || echo "Tests failed (expected for nightly)"

      - name: Upload nightly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chiaengine-nightly-${{ github.sha }}
          path: |
            build/bin/*
            build/lib/*
            build/archives/*
          retention-days: 3