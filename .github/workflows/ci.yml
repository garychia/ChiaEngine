name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]  # Push tags starting with v
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC daily (see the nightly job)

env:
  # Build type
  BUILD_TYPE: Debug
  # Cache key prefix
  CACHE_PREFIX: chiaengine-${{ github.sha }}

jobs:
  # Matrix build and test across OS and compilers
  build-and-test:
    name: Build and Test (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    # Scheduled runs are handled by the nightly job instead
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        # Include-only matrix: each entry is one exact OS/compiler combo.
        # (A base os/compiler cross-product would emit unsupported combos
        # such as windows/gcc and ubuntu/msvc.)
        include:
          # Linux: gcc and clang
          - os: ubuntu-24.04
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-24.04
            compiler: clang
            cc: clang
            cxx: clang++
          # Windows: MSVC only (default)
          - os: windows-2022
            compiler: msvc
            cc: cl
            cxx: cl
          # macOS: AppleClang
          - os: macos-14
            compiler: appleclang
            cc: clang
            cxx: clang++
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get all tags for versioning

      - name: Setup dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake g++ git libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev pkg-config libvulkan-dev ccache \
            clang-tidy clang-format lcov xvfb

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup dependencies (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 20
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          # vulkan-sdk is a cask whose installer needs an interactive sudo
          # password, so it hangs on unattended runners. Headers + loader +
          # MoltenVK come from formulas and are enough for find_package(Vulkan).
          brew install cmake ninja pkg-config ccache \
            vulkan-headers vulkan-loader molten-vk
          # Point FindVulkan at the Homebrew prefix (headers and libvulkan).
          echo "VULKAN_SDK=$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Setup Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ninja-build
        # macOS: brew install ninja (already done above)

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/.ccache
          key: ccache-${{ runner.os }}-${{ matrix.compiler }}-${{ hashFiles('CMakeLists.txt', 'src/CMakeLists.txt') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.compiler }}-

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          # ccache is only installed on Linux/macOS runners; omit the
          # launcher elsewhere (on Windows the missing ccache binary made
          # every compile fail with "CreateProcess failed").
          launcher_args=()
          if command -v ccache >/dev/null 2>&1; then
            launcher_args+=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          fi
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            "${launcher_args[@]}" \
            -DGLFW_BUILD_TESTS=OFF \
            -DGLFW_BUILD_EXAMPLES=OFF \
            -GNinja

      - name: Build engine and tests
        run: cmake --build build --parallel

      - name: Run unit tests
        env:
          # Each leg dumps its replay hash sequence here; determinism-compare diffs
          # them. "Replay hash identical across compilers" has to be a checked
          # fact, not a sentence in a document (#144).
          CHIA_REPLAY_HASH_DUMP: replay-hashes-${{ matrix.compiler }}.txt
          # Self-describing fingerprint of the same run: recipe version + registered
          # component type list (#150). Deliberately a separate file: the type-name
          # column is compiler-specific, so it must never be diffed the way the
          # value-only hash sequence above is.
          CHIA_HASH_RECORD_DUMP: hash-record-${{ matrix.compiler }}.txt
        run: |
          test_bin=./build/bin/TestMain
          if [ "${{ runner.os }}" = "Windows" ]; then test_bin="${test_bin}.exe"; fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            # xvfb provides the headless display the windowing tests need
            xvfb-run -a "${test_bin}"
          else
            "${test_bin}"
          fi

      - name: Upload replay hash sequence
        # Uploaded even when the tests fail: the sequence is the diagnostic, and the
        # compare job fails loudly on a missing leg rather than assuming agreement.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-hashes-${{ matrix.os }}-${{ matrix.compiler }}-${{ github.sha }}
          path: replay-hashes-${{ matrix.compiler }}.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload world hash record
        # Audit trail, not a comparison: the record carries the recipe version and the
        # registered component type list. Its name column is compiler-specific by
        # design (see Data/TypeName.hpp), so determinism-compare checks only that the
        # recipe version agrees across legs and prints the records for the log.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hash-records-${{ matrix.os }}-${{ matrix.compiler }}-${{ github.sha }}
          path: hash-record-${{ matrix.compiler }}.txt
          if-no-files-found: warn
          retention-days: 30

      # Diagnostic for #108: capture the macOS SIGTRAP (exit 133) backtrace.
      # continue-on-error + `|| true` guarantee this can never fail the job.
      - name: Capture macOS crash backtrace
        if: failure() && runner.os == 'macOS'
        continue-on-error: true
        run: |
          # Even when lldb cannot unwind, the link register identifies the caller
          # and the disassembly shows the trap instruction itself.
          lldb -b -o run -o "process status" \
            -o "register read pc sp fp lr x0 x1 x2" \
            -o 'image lookup --address $lr' \
            -o "disassemble --frame" \
            -o "thread backtrace all" -o quit -- ./build/bin/TestMain \
            > lldb-crash.log 2>&1 || true
          # The backtrace is at the end, after the full test output.
          tail -n 400 lldb-crash.log || true

      - name: Upload macOS crash backtrace
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-lldb-backtrace-${{ matrix.compiler }}-${{ github.sha }}
          path: lldb-crash.log
          if-no-files-found: warn
          retention-days: 7

      - name: Test ChiaApp build (link check)
        run: cmake --build build --parallel --target ChiaApp

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chiaengine-${{ matrix.os }}-${{ matrix.compiler }}-${{ github.sha }}
          path: |
            build/bin/*
            build/lib/*
            build/archives/*
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            Testing/*/Test*.log
            build/Testing/*/Test*.log
          retention-days: 30

  # "Replay hash identical across compilers" is a sentence in the determinism
  # document; this job turns it into a checked fact (#144). Every leg runs the same
  # scripted input through its own compiler and dumps its hash sequence; the
  # sequences have to agree bit for bit.
  determinism-compare:
    name: Determinism (cross-compiler replay hashes)
    runs-on: ubuntu-24.04
    needs: [build-and-test]
    if: always() && github.event_name != 'schedule'
    steps:
      - name: Download per-leg hash sequences
        uses: actions/download-artifact@v4
        with:
          pattern: replay-hashes-*-${{ github.sha }}
          path: hashes

      - name: Download per-leg world hash records
        uses: actions/download-artifact@v4
        with:
          pattern: hash-records-*-${{ github.sha }}
          path: records

      - name: Compare sequences
        run: |
          set -euo pipefail
          mapfile -t files < <(find hashes -name 'replay-hashes-*.txt' | sort)
          echo "hash sequences found: ${#files[@]}"
          printf '  %s\n' "${files[@]}"

          # All four legs are compared. MSVC was measured to agree value-for-value
          # with gcc (only its text-mode line endings differ, hence
          # --strip-trailing-cr), so excluding it would weaken the claim for nothing.
          cmp_files=("${files[@]}")

          # A missing leg must fail the job, never look like agreement.
          if [ "${#cmp_files[@]}" -lt 4 ]; then
            echo "::error::expected gcc + clang + appleclang + msvc hash sequences, found ${#cmp_files[@]}"
            exit 1
          fi

          ref="${cmp_files[0]}"
          echo "reference sequence: $ref"
          status=0
          for f in "${cmp_files[@]}"; do
            if diff -u --strip-trailing-cr "$ref" "$f"; then
              echo "OK: $f matches the reference"
            else
              echo "::error file=$f::replay hash sequence differs from $ref - the cross-compiler determinism claim does not hold"
              status=1
            fi
          done
          exit "$status"

      - name: Check the recorded recipe agrees across legs
        run: |
          set -euo pipefail
          mapfile -t records < <(find records -name 'hash-record-*.txt' | sort)
          echo "hash records found: ${#records[@]}"
          printf '  %s\n' "${records[@]}"

          # The records are deliberately NOT compared value-for-value: the name
          # column comes from __PRETTY_FUNCTION__ / __FUNCSIG__ and therefore
          # differs per compiler by design (see Data/TypeName.hpp). What must agree
          # is the recipe - if two legs hashed different inputs, the sequence
          # comparison above was meaningless even when it passed (#150). The records
          # are printed so the artifact trail is readable straight from the log.
          if [ "${#records[@]}" -lt 4 ]; then
            echo "::error::expected gcc + clang + appleclang + msvc hash records, found ${#records[@]}"
            exit 1
          fi

          ref_recipe=""
          status=0
          for f in "${records[@]}"; do
            recipe=$(head -n 1 "$f" | tr -d '\r')
            echo "--- $f"
            sed 's/\r$//' "$f"
            if [ -z "$ref_recipe" ]; then
              ref_recipe="$recipe"
              echo "reference recipe: $recipe"
            elif [ "$recipe" != "$ref_recipe" ]; then
              echo "::error file=$f::recipe '$recipe' differs from '$ref_recipe' - the legs did not hash the same inputs"
              status=1
            fi
          done
          exit "$status"

  # Code quality checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-24.04
    needs: [build-and-test]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup dependencies
        run: |
          # clang-tidy needs to configure the project to produce a compile database, so
          # this job needs the same dev packages as build-and-test (X11 for GLFW, Vulkan,
          # pkg-config) plus ninja for the generator. See #119.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            clang-format-18 clang-tidy python3-pip \
            cmake g++ git pkg-config ninja-build \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libvulkan-dev

      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run clang-format check (advisory - reports, never fails)
        continue-on-error: true
        run: |
          # Pinned to clang-format 18 on purpose: the baseline below was measured with
          # 18.1.x, while the unversioned package moves with the distro (18 on
          # ubuntu-24.04, 21 on newer releases) and would make the numbers incomparable.
          # Advisory by design, see #114: the tree is not clang-format clean. Most
          # differences are trailing comments aligned by CJK display width, which
          # clang-format counts as one column per code point.
          # Vendored and generated files are excluded - not ours to format:
          # 3rdparty/, *_spv.h and miniaudio.h (vendored upstream, ~19k lines,
          # 0 diagnostics: pure cost). The timeout bounds the run so a stalled
          # clang-format can never hold the runner open.
          find src -type f \( -name "*.hpp" -o -name "*.h" -o -name "*.cpp" -o -name "*.c" \) \
            ! -path "*/3rdparty/*" ! -name "*_spv.h" ! -name "miniaudio.h" | sort > files.txt
          if [ ! -s files.txt ]; then
            echo "clang-format: no source files found - nothing to check"
            exit 0
          fi
          timeout 240 clang-format-18 --dry-run --Werror --files=files.txt > clang-format-report.txt 2>&1 || true
          total=$(grep -c "clang-format-violations" clang-format-report.txt || true)
          echo "clang-format-18 (advisory): ${total} diagnostic(s) across $(wc -l < files.txt) file(s)"
          echo "--- most affected files ---"
          grep "clang-format-violations" clang-format-report.txt | grep -oE "^[^:]+" | sort | uniq -c | sort -rn | head -10
          echo "--- first 20 diagnostics ---"
          head -20 clang-format-report.txt

      - name: Run clang-tidy
        run: |
          # clang-tidy needs a compile database, not a built tree. This step used to
          # configure AND build the whole engine just to lint it, duplicating what
          # build-and-test already does on the same runner (#119). Configure with the
          # database exported and the PCH disabled instead: the PCH is what makes a
          # configure-only database unusable, since its GCC .gch artifact only exists
          # after a build and clang-tidy could not consume it anyway. Verified locally:
          # 70 translation units, zero references to generated artifacts.
          TIDY_RUNNER=$(command -v run-clang-tidy-18 || command -v run-clang-tidy || true)
          if [ -z "$TIDY_RUNNER" ]; then
            echo "No run-clang-tidy binary found (checked run-clang-tidy-18 and run-clang-tidy)."
            echo "clang-tidy files present in /usr/bin:"; ls /usr/bin | grep -i clang-tidy || true
            exit 1
          fi
          cmake -S . -B build-tidy -GNinja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
          echo "Compile database: $(grep -c '"file"' build-tidy/compile_commands.json) translation unit(s)"
          "$TIDY_RUNNER" -p build-tidy -header-filter='.*' || echo "Clang-tidy found issues (expected during development)"

      - name: Run cppcheck
        run: |
          cppcheck --enable=all --suppress=missingIncludeSystem --inline-suppr \
            src/ || echo "Cppcheck found issues (review needed)"

      - name: Check for TODO/FIXME comments
        run: |
          if git grep -i -E "TODO|FIXME|HACK|XXX" -- "*.hpp" "*.h" "*.cpp" "*.c" "*.md"; then
            echo "Warning: Found TODO/FIXME comments"
          fi

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-24.04
    needs: [build-and-test]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install security tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            binutils gcc make pkg-config re2c  # For flawfinder
          pip3 install bandit safety flawfinder

      - name: Run flawfinder (C/C++ security scanner)
        run: |
          find src -type f \( -name "*.hpp" -o -name "*.h" -o -name "*.cpp" -o -name "*.c" \) ! -name "miniaudio.h" | xargs flawfinder --dataonly --quiet || echo "Flawfinder completed"

      - name: Run bandit (Python security)
        if: false  # Disable for now as we have minimal Python
        run: |
          bandit -r . || echo "Bandit completed"

      - name: Check for dangerous functions
        run: |
          if grep -r -nE '\b(gets|strcpy|strcat|sprintf|vsprintf)[[:space:]]*\(' src/ \
               --include="*.hpp" --include="*.h" --include="*.cpp" --include="*.c" \
               --exclude="miniaudio.h"; then
            echo "Warning: Found potentially dangerous C functions"
            exit 1
          fi

  # Documentation validation
  docs:
    name: Documentation Check
    runs-on: ubuntu-24.04
    needs: [build-and-test]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for broken links in markdown
        run: |
          npm install -g markdown-link-check
          shopt -s globstar nullglob
          files=(README.md docs/**/*.md)
          if [ ${#files[@]} -lt 2 ]; then
            echo "Expected at least README.md plus one docs/ file"
            exit 1
          fi
          markdown-link-check "${files[@]}"

      - name: Validate CMakeLists.txt syntax
        run: |
          # Configuring needs the same dev packages as build-and-test (X11,
          # Vulkan, pkg-config); without them this job could never pass.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake g++ git libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev pkg-config libvulkan-dev
          # Keep the configure log: its tail is the only real error output.
          if cmake -S . -B build-validate > cmake-configure.log 2>&1; then
            echo "CMake configuration successful"
          else
            echo "CMake configuration failed - last 40 lines of the configure log:"
            tail -n 40 cmake-configure.log
            exit 1
          fi

  # Release workflow
  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: [build-and-test, code-quality, security, docs]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write  # Needed to create releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake g++ git libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev pkg-config libvulkan-dev ccache zip

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/.ccache
          key: ccache-release-${{ hashFiles('CMakeLists.txt', 'src/CMakeLists.txt') }}
          restore-keys: |
            ccache-release-

      - name: Configure and build (Release)
        run: |
          # ccache may not be installed; omit the launcher then.
          launcher_args=()
          if command -v ccache >/dev/null 2>&1; then
            launcher_args+=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          fi
          cmake -B build-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            "${launcher_args[@]}" \
            -DGLFW_BUILD_TESTS=OFF \
            -DGLFW_BUILD_EXAMPLES=OFF \
            -GNinja
          cmake --build build-release --parallel

      # shortcut: packages the build-and-test artifacts (Debug); build Release
      # per-platform when optimized binaries are needed.
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          pattern: chiaengine-windows-*-${{ github.sha }}
          path: artifacts/windows
          merge-multiple: true

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          pattern: chiaengine-macos-*-${{ github.sha }}
          path: artifacts/macos
          merge-multiple: true

      - name: Create release assets
        run: |
          mkdir -p release
          # Copy binaries
          cp build-release/bin/* release/ 2>/dev/null || true
          cp build-release/lib/* release/ 2>/dev/null || true
          # Create version file
          echo "${GITHUB_REF_NAME}" > release/VERSION
          # Create changelog from git log
          git log --oneline --no-merges $(git describe --tags --abbrev=0)..HEAD > release/CHANGELOG.md || echo "No changelog entries" > release/CHANGELOG.md
          # Create tarball
          tar -czf chiaengine-${{ github.ref_name }}-linux.tar.gz -C release .

      - name: Create Windows zip
        run: |
          cd artifacts/windows
          zip -r ../../chiaengine-${{ github.ref_name }}-windows.zip .

      - name: Create macOS tarball
        run: tar -czf chiaengine-${{ github.ref_name }}-macos.tar.gz -C artifacts/macos .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ChiaEngine ${{ github.ref_name }}
          body: |
            ChiaEngine release ${{ github.ref_name }}

            ## Assets
            - Linux binaries (tar.gz)
            - Windows binaries (zip)
            - macOS binaries (tar.gz)

            ## Build Info
            - Built on: ubuntu-24.04 (Linux), windows-2022 (Windows), macos-14 (macOS)
            - Commit: ${{ github.sha }}

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/release/CHANGELOG.md) for details.
          files: |
            release/*
            chiaengine-*.tar.gz
            chiaengine-*.zip
          draft: false
          prerelease: false

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chiaengine-release-${{ github.ref_name }}
          path: |
            release/*
            chiaengine-*.tar.gz
            chiaengine-*.zip
          retention-days: 90

  # Nightly builds (for develop branch)
  nightly:
    name: Nightly Build
    runs-on: ubuntu-24.04
    # Runs from the top-level `schedule` trigger, or on pushes to develop
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake g++ git libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev pkg-config libvulkan-dev ccache

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/.ccache
          key: ccache-nightly-${{ hashFiles('CMakeLists.txt', 'src/CMakeLists.txt') }}
          restore-keys: |
            ccache-nightly-

      - name: Build and test
        run: |
          # ccache may not be installed; omit the launcher then.
          launcher_args=()
          if command -v ccache >/dev/null 2>&1; then
            launcher_args+=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          fi
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            "${launcher_args[@]}" \
            -DGLFW_BUILD_TESTS=OFF \
            -DGLFW_BUILD_EXAMPLES=OFF \
            -GNinja
          cmake --build build --parallel
          ./build/bin/TestMain || echo "Tests failed (expected for nightly)"

      - name: Upload nightly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chiaengine-nightly-${{ github.sha }}
          path: |
            build/bin/*
            build/lib/*
            build/archives/*
          retention-days: 3